[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-input-rerank"
version = "0.1.0"
description = "Context-aware reranking core and offline benchmark for a macOS pinyin IME"
requires-python = ">=3.11"
dependencies = [
  "pypinyin>=0.51",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["mlx-lm>=0.31,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires the optional compiled librime baseline or real MLX model"]
