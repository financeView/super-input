# super-input benchmark/service schema. This is the sole source of fuzzy rules.
schema:
  schema_id: superpinyin
  name: SuperInput benchmark pinyin
  version: 1

engine:
  processors: [speller, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  algebra:
    - derive/^([zcs])h/$1/          # zh/ch/sh -> z/c/s
    - derive/^([zcs])/$1h/          # z/c/s -> zh/ch/sh
    - derive/([ei])n$/$1ng/         # in/en -> ing/eng
    - derive/([ei])ng$/$1n/         # ing/eng -> in/en
    - derive/([aou])n$/$1ng/        # an/on/un -> ang/ong/ung (invalid forms discarded)
    - derive/([aou])ng$/$1n/        # ang/ong/ung -> an/on/un

menu:
  page_size: 20

translator:
  dictionary: luna_pinyin
